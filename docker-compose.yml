services:
  db:
    image: mysql:8.0
    container_name: dalmoa-db
    restart: always
    environment:
      MYSQL_DATABASE: dalmoa
      MYSQL_ROOT_PASSWORD: ***REMOVED***
      MYSQL_USER: dalmoa
      MYSQL_PASSWORD: ***REMOVED***
    volumes:
      - ./mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: dalmoa-backend
    restart: always
    environment:
      DB_URL: jdbc:mysql://db:3306/dalmoa?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: dalmoa
      DB_PASSWORD: ***REMOVED***
      JWT_SECRET: ***REMOVED***
      EXCHANGE_API_KEY: ***REMOVED***
    depends_on:
      - db

  nginx:
    image: nginx:latest
    container_name: dalmoa-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    container_name: dalmoa-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
